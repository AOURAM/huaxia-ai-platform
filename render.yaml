services:
  - type: web
    name: huaxia-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: python -m pip install -r requirements-render.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: PYTHON_VERSION
        value: '3.12.11'
      - key: HUAXIA_AI_ENABLED
        value: 'false'
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
